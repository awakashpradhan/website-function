<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Login</title>
</head>

<body>

    <div class="input">

        <input 
            type="text" 
            id="first" 
            placeholder="Enter your username"
        >

        <input 
            type="password" 
            id="second" 
            placeholder="Enter your password"
        >

        <button id="btn">Click to Submit</button>

    </div>

    <div id="result"></div>

    <script>

        const username = document.getElementById("first");
        const password = document.getElementById("second");
        const button = document.getElementById("btn");
        const result = document.getElementById("result");


        button.addEventListener("click", async function () {

            // Get values from inputs
            const userValue = username.value;
            const passValue = password.value;


            // Check if inputs are empty
            if (userValue === "" || passValue === "") {
                result.innerHTML = "Please enter username and password.";
                return;
            }


            try {

                // Send POST request
                const response = await fetch(
                    "https://dummyjson.com/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username: userValue,
                            password: passValue,
                            expiresInMins: 30
                        }),

                        credentials: "include"
                    }
                );


                // Convert response to JavaScript object
                const data = await response.json();


                // Check if API returned an error
                if (!response.ok) {
                    throw new Error(data.message);
                }


                // Display response
                result.innerHTML = `
                    <h3>Login Successful!</h3>
                    <p><strong>Name:</strong> ${data.firstName} ${data.lastName}</p>
                    <p><strong>Username:</strong> ${data.username}</p>
                    <p><strong>Email:</strong> ${data.email}</p>
                    <p><strong>Token:</strong> ${data.accessToken}</p>
                    
                `;

                console.log(data);

            } catch (error) {

                result.innerHTML = `
                    <p style="color:red;">
                        Login failed: ${error.message}
                    </p>
                `;

                console.error(error);
            }

        });

    </script>

</body>

</html>
